[package]
name = "plain-sight"
version = "1.0.0"
description = "Plain Sight as a desktop app: the web page in a native window"
authors = ["Pranav Ongole"]
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
# The system folder picker. Used directly, without tauri-plugin-dialog, which
# would add three more crates and a script in the page (folder.rs). Its default
# features are Linux backends only.
rfd = { version = "=0.17.2", default-features = false }
# The { name } object the folder commands return. Already used by Tauri.
serde = { version = "1", features = ["derive"] }

# Test builds only, for the e2e feature below. The versions are the ones
# Tauri already uses, so nothing new is downloaded.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
serde_json = { version = "1", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }

[features]
# End-to-end test builds only (src/e2e.rs): the tests read the page and take
# pictures of it. Never part of the release app: `npm run app:build` builds
# without it, and `npm run build:e2e` builds it into its own target folder.
e2e = ["dep:objc2", "dep:block2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-web-kit", "dep:serde_json"]

# Smallest binary rather than fastest build (DR-06).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
